name: PR build check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.139.4'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: themes/cooklang-tw/package-lock.json

      - name: Install Node dependencies
        working-directory: themes/cooklang-tw
        run: npm ci

      # Keep in sync with the "Build CSS" step in gh-pages.yml
      - name: Build CSS
        working-directory: themes/cooklang-tw
        run: npx tailwindcss -i ./assets/css/main.css -o ./static/css/style.css --minify

      - name: Build site
        run: hugo --minify

      - name: Check CSS was generated
        run: test -s public/css/style.css
